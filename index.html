<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  /* 眼睛眼眶：纯黑椭圆，无高光 */
  .eye {
    position:absolute;
    background:#000;
    border-radius: 50%; /* 平滑椭圆 */
    box-shadow: inset 0 0 10px rgba(0,0,0,1);
    opacity: 0;
    transform: scale(0);
    pointer-events: none; /* 防止挡住底层触摸事件 */
    display: flex;
    align-items: center;
    justify-content: center;
    /* 颤抖动画准备 */
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* 眼珠（瞳孔）：极深灰色，无高光，用于体现看向的方向 */
  .pupil {
    position: absolute;
    width: 38%;
    height: 70%;
    background: #111; /* 比纯黑略亮，但不发光，无高光 */
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease-out; /* 眼珠转动顺滑过渡 */
    box-shadow: 0 0 5px #000;
  }

  /* 眼睛出现后：弹性缩放 + 持续微微颤抖 */
  .eye.spawned {
    opacity: 1;
    transform: scale(1);
    animation: shake 0.15s linear infinite;
  }

  /* 微微颤抖动画 */
  @keyframes shake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(1deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-1deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0.5deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  .vignette {
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);
  }

  /* 文字样式：黑字加粗黑体，保持在中间 */
  .text-wrap {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw;
    pointer-events:none;
  }

  .text {
    max-width:1000px;
    color:#000;
    font-weight:900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size:clamp(26px, 6vw, 64px);
    line-height:1.55;
    text-align:center;
    letter-spacing:.06em;
    text-shadow: none;
  }

  /* 闪烁遮罩层 */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* 一直闪烁的动画 */
  .flashing #flash-overlay {
    animation: flashInfinite 0.15s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.5; } /* 半透明黑，保证红底和黑字依然可见，但极度闪烁 */
  }

  .flashing .text {
    animation: textFlash 0.15s infinite;
  }
  @keyframes textFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette"></div>

<div class="text-wrap">
  <div class="text">
    我很痛苦<br>
    我感觉到我的灵魂似乎割裂了<br>
    所有人都这么做吗<br>
    我不理解<br>
    究竟是我脑子出问题了<br>
    还是他们都不正常呢？
  </div>
</div>

<script>
  const eyesLayer = document.getElementById('eyes');

  // 1. 生成四周边缘的眼睛，防止重叠和遮挡文字
  function createEyes() {
    eyesLayer.innerHTML = '';

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    
    // 定义四周安全区域（百分比），避开中间文字区域
    const regions = [
      { xMin: 5, xMax: 95, yMin: 5, yMax: 20 },   // 顶部
      { xMin: 5, xMax: 95, yMin: 80, yMax: 95 },  // 底部
      { xMin: 5, xMax: 15, yMin: 20, yMax: 80 },  // 左侧
      { xMin: 85, xMax: 95, yMin: 20, yMax: 80 }  // 右侧
    ];

    const placedEyes = []; // 记录已放置的眼睛坐标，防重叠
    const eyeCount = Math.min(30, Math.max(12, Math.floor(screenW / 50))); // 控制总数量

    for (let i = 0; i < eyeCount; i++) {
      // 随机选择区域
      const region = regions[i % regions.length];
      
      let x, y, w, h, cx, cy;
      let validPlacement = false;
      let attempts = 0;

      // 防重叠检测算法
      while (!validPlacement && attempts < 50) {
        x = region.xMin + Math.random() * (region.xMax - region.xMin); // 百分比
        y = region.yMin + Math.random() * (region.yMax - region.yMin); // 百分比
        
        w = Math.random() * 80 + 40; // 眼睛宽度 40~120px
        h = w * 0.45; // 眼睛高度

        // 计算实际屏幕像素中心点
        cx = (x / 100) * screenW;
        cy = (y / 100) * screenH;

        // 检查距离（防止重叠）
        let tooClose = false;
        for (let eye of placedEyes) {
          const dist = Math.hypot(cx - eye.cx, cy - eye.cy);
          if (dist < (w + eye.w) * 0.8) { // 安全距离
            tooClose = true;
            break;
          }
        }

        if (!tooClose) {
          validPlacement = true;
        }
        attempts++;
      }

      // 如果尝试50次都找不到位置，放弃这只眼睛
      if (!validPlacement) continue;

      // 记录本次位置
      placedEyes.push({ cx, cy, w });

      // 创建 DOM
      const el = document.createElement('div');
      el.className = 'eye';
      
      const pupil = document.createElement('div');
      pupil.className = 'pupil';
      el.appendChild(pupil);

      // 设置样式
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      
      // 记录眼睛的实际像素中心，供鼠标交互使用（忽略抖动偏差）
      el.dataset.cx = cx;
      el.dataset.cy = cy;

      eyesLayer.appendChild(el);
    }
  }

  // 2. 交互：手指/鼠标触碰屏幕，眼珠看向触碰点
  function handleMove(e) {
    let clientX, clientY;
    
    // 兼容触摸和鼠标事件
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    // 遍历所有眼睛，计算角度
    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const eyeX = parseFloat(eye.dataset.cx);
      const eyeY = parseFloat(eye.dataset.cy);
      
      // 计算眼睛到触点的角度
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      
      // 瞳孔最大偏移量（眼睛宽度的15%）
      const eyeWidth = parseFloat(eye.style.width);
      const maxShift = eyeWidth * 0.15;
      
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      const pupil = eye.querySelector('.pupil');
      if (pupil) {
        // 更新瞳孔位置，保留基础居中偏移
        pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      }
    });
  }

  // 监听事件 (移动端加上 passive: false 避免滚动冲突)
  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });

  // 3. 初始化与动画序列
  createEyes();

  // 1.5秒后，触发无限闪烁，并让眼睛瞬间出现
  setTimeout(() => {
    // 开启疯狂闪烁（无限循环）
    document.body.classList.add('flashing');

    // 眼睛突然弹出
    document.querySelectorAll('.eye').forEach(eye => {
      eye.classList.add('spawned');
    });
  }, 1500);

  // 窗口调整大小时重新生成布局
  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(createEyes, 300);
  });
</script>

</body>
</html>
