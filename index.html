<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  .eye {
    position:absolute;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.9));
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    transform: scale(0);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .eye-shape {
    width: 100%;
    height: 100%;
    background: #fff;
    clip-path: polygon(
      0% 50%, 10% 20%, 30% 8%, 55% 5%, 85% 15%,
      100% 45%, 90% 75%, 65% 95%, 35% 92%, 15% 80%
    );
    box-shadow: inset 0 0 15px rgba(180, 0, 0, 0.9), inset 0 0 5px rgba(255, 0, 0, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    filter: drop-shadow(2px 0 0 rgba(0,255,255,0.3)) drop-shadow(-2px 0 0 rgba(255,0,0,0.3));
  }

  .eye-shape::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(150, 0, 0, 0.4) 0%, transparent 20%),
      radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.3) 0%, transparent 25%),
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(100, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  .pupil {
    position: absolute;
    width: 35%;
    height: 65%;
    background: #000;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    box-shadow: 0 0 8px #000;
  }

  .eye.spawned {
    opacity: 1;
    transform: scale(1);
    animation: shake 0.12s linear infinite;
  }

  @keyframes shake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(1deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-1deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0.5deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  .eye-shape.blinking {
    animation: blinkAnim 0.25s ease-in-out;
  }
  @keyframes blinkAnim {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.05); }
  }

  .vignette {
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);
  }

  .text-wrap {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2vw;
    pointer-events:none;
  }

  .text {
    color: #ff0000;
    font-weight: 900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size: clamp(40px, 12vw, 120px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: 0.1em;
    text-shadow: 
      4px 0 0 #00ffff, 
      -4px 0 0 #0000ff,
      0 0 30px #ff0000,
      0 0 60px #ff0000;
    animation: textGlitch 0.15s infinite alternate;
  }

  @keyframes textGlitch {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(-3px, 2px); opacity: 0.8; }
  }

  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flashing #flash-overlay {
    animation: flashInfinite 0.12s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
  }

  .flashing .text {
    animation: textFlash 0.12s infinite;
  }
  @keyframes textFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette"></div>

<!-- 文字改回“我看见你了” -->
<div class="text-wrap">
  <div class="text">
    我看见你了<br>
    我看见你了<br>
    我看见你了
  </div>
</div>

<script>
  // ================= 音频系统 =================
  let audioCtx = null;
  let isAudioInitialized = false;
  let flickerSoundInterval = null;
  let reverseSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // 1. 背景不适音：双频拍频 + 高频耳鸣
    const lowOsc1 = audioCtx.createOscillator();
    const lowOsc2 = audioCtx.createOscillator();
    const lowGain = audioCtx.createGain();
    lowOsc1.type = 'sine';
    lowOsc1.frequency.value = 50;
    lowOsc2.type = 'sine';
    lowOsc2.frequency.value = 53;
    lowGain.gain.value = 0.08; 
    lowOsc1.connect(lowGain);
    lowOsc2.connect(lowGain);
    lowGain.connect(audioCtx.destination);
    lowOsc1.start();
    lowOsc2.start();

    const tinnitusOsc = audioCtx.createOscillator();
    const tinnitusGain = audioCtx.createGain();
    tinnitusOsc.type = 'sine';
    tinnitusOsc.frequency.value = 8000;
    tinnitusGain.gain.value = 0.015;
    tinnitusOsc.connect(tinnitusGain);
    tinnitusGain.connect(audioCtx.destination);
    tinnitusOsc.start();

    // 2. 突出人声：模糊低语
    const whisperBufferSize = audioCtx.sampleRate * 4;
    const whisperBuffer = audioCtx.createBuffer(1, whisperBufferSize, audioCtx.sampleRate);
    const whisperData = whisperBuffer.getChannelData(0);
    for (let i = 0; i < whisperBufferSize; i++) {
        whisperData[i] = Math.random() * 2 - 1;
    }
    const whisperSource = audioCtx.createBufferSource();
    whisperSource.buffer = whisperBuffer;
    whisperSource.loop = true;
    
    const whisperFilter = audioCtx.createBiquadFilter();
    whisperFilter.type = 'bandpass';
    whisperFilter.frequency.value = 1200;
    whisperFilter.Q.value = 8;
    
    const whisperLfo = audioCtx.createOscillator();
    const whisperLfoGain = audioCtx.createGain();
    whisperLfo.frequency.value = 5; 
    whisperLfoGain.gain.value = 800; 
    whisperLfo.connect(whisperLfoGain);
    whisperLfoGain.connect(whisperFilter.frequency);
    
    const whisperGain = audioCtx.createGain();
    whisperGain.gain.value = 0.25; 
    
    whisperSource.connect(whisperFilter);
    whisperFilter.connect(whisperGain);
    whisperGain.connect(audioCtx.destination);
    whisperSource.start();
    whisperLfo.start();

    flickerSoundInterval = setInterval(playFlickerSound, 130);
    
    reverseSoundInterval = setInterval(() => {
      if (Math.random() > 0.6) playReverseSound();
    }, 4000);
  }

  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.3) return; 
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function playReverseSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function playBlinkSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  }

  let lastStickySoundTime = 0;
  function playStickySound() {
    if (!audioCtx) return;
    const now = Date.now();
    if (now - lastStickySoundTime < 50) return;
    lastStickySoundTime = now;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200 + Math.random() * 150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
    
    filter.type = 'lowpass';
    filter.frequency.value = 600;
    
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  function playJumpscare() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // ================= 视觉与交互系统 =================
  const eyesLayer = document.getElementById('eyes');

  function createEyes() {
    eyesLayer.innerHTML = '';
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    
    const gridSize = 60; 
    const cols = Math.floor(screenW / gridSize);
    const rows = Math.floor(screenH / gridSize);
    const totalCells = cols * rows;
    
    const eyeCount = Math.floor(totalCells * 0.4); 
    const placedEyes = [];
    
    let attempts = 0;
    while (placedEyes.length < eyeCount && attempts < 500) {
      attempts++;
      
      const col = Math.floor(Math.random() * cols);
      const row = Math.floor(Math.random() * rows);
      
      const cx = (col + 0.5) * gridSize + (Math.random() * 20 - 10);
      const cy = (row + 0.5) * gridSize + (Math.random() * 20 - 10);
      
      const w = Math.random() * 50 + 40; 
      const h = w * 0.45;

      let tooClose = false;
      for (let eye of placedEyes) {
        const dist = Math.hypot(cx - eye.cx, cy - eye.cy);
        if (dist < (w + eye.w) * 0.7) { 
          tooClose = true;
          break;
        }
      }

      if (!tooClose) {
        placedEyes.push({ cx, cy, w });

        const el = document.createElement('div');
        el.className = 'eye';
        
        const eyeShape = document.createElement('div');
        eyeShape.className = 'eye-shape';
        
        const pupil = document.createElement('div');
        pupil.className = 'pupil';
        
        eyeShape.appendChild(pupil);
        el.appendChild(eyeShape);

        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        
        el.dataset.scale = 1;

        eyesLayer.appendChild(el);
      }
    }
  }

  function handleMove(e) {
    initAudio();
    let clientX, clientY;
    
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      const eyeWidth = parseFloat(eye.style.width);
      
      const maxShift = eyeWidth * 0.22; 
      
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      let pupilScale = 1;
      let eyelidScale = 1;
      const normalizedDy = dy / eyeWidth; 
      
      if (normalizedDy < 0) {
        pupilScale = 1 + Math.abs(normalizedDy) * 2.0;
        eyelidScale = 1 + Math.abs(normalizedDy) * 0.4; 
      } else {
        pupilScale = 1 - normalizedDy * 1.6;
        eyelidScale = 1 - normalizedDy * 0.4; 
      }
      
      pupilScale = Math.min(1.45, Math.max(0.65, pupilScale));
      eyelidScale = Math.min(1.4, Math.max(0.6, eyelidScale));
      
      const eyeShape = eye.querySelector('.eye-shape');
      const pupil = eye.querySelector('.pupil');
      
      if (pupil) {
        pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${pupilScale})`;
      }
      
      if (eyeShape && !eyeShape.classList.contains('blinking')) {
        eyeShape.style.transform = `scaleY(${eyelidScale})`;
      }
    });

    playStickySound();
  }

  function handleClick(e) {
    initAudio();
    playBlinkSound();
    
    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const eyeShape = eye.querySelector('.eye-shape');
      if (eyeShape) {
        eyeShape.classList.add('blinking');
        setTimeout(() => {
          eyeShape.classList.remove('blinking');
          eyeShape.style.transform = ''; 
        }, 300);
      }
    });
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });
  document.addEventListener('click', handleClick);
  document.addEventListener('touchstart', handleClick, { passive: false });

  createEyes();

  setTimeout(() => {
    initAudio(); 
    document.body.classList.add('flashing');
    document.querySelectorAll('.eye').forEach(eye => {
      eye.classList.add('spawned');
    });
    playJumpscare();
  }, 1500);

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(createEyes, 300);
  });
</script>

</body>
