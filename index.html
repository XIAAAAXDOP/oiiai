<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC","Heiti SC",sans-serif; }

  /* 故障红黑背景层 */
  #glitch-bg {
    position: fixed; inset: 0; z-index: 1;
    background: #ff0000;
    animation: bgFlash 0.15s infinite alternate;
  }
  @keyframes bgFlash {
    0% { background: #000; }
    100% { background: #ff0000; }
  }

  /* 扫描线覆盖层 */
  #scanlines {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.6) 0px, rgba(0,0,0,0.6) 2px, transparent 2px, transparent 4px);
    opacity: 0.8;
  }

  /* 背景巨大幽灵眼层 */
  #bg-eyes { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .bg-eye {
    position: absolute;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.8) 20%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    filter: blur(8px);
    animation: bgEyeDrift 15s infinite linear alternate;
  }
  .bg-eye::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 40%; height: 60%; background: #000; border-radius: 50%;
  }
  @keyframes bgEyeDrift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(20px, 20px) scale(1.1); }
  }

  /* 互动眼睛层（遍布全屏） */
  #eyes { position: fixed; inset: 0; z-index: 10; overflow: hidden; }
  .eye {
    position: absolute; opacity: 0; transform: scale(0); pointer-events: auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .eye.spawned { opacity: 1; transform: scale(1); }
  .eye-shape {
    position: relative; width: 100%; height: 100%;
    clip-path: polygon(0% 50%, 8% 22%, 25% 8%, 50% 2%, 75% 8%, 92% 22%, 100% 50%, 92% 78%, 75% 92%, 50% 98%, 25% 92%, 8% 78%);
    background: radial-gradient(ellipse at 50% 50%, #fff 60%, #ddd 100%);
    overflow: hidden; transform: scaleY(1); transition: transform 0.15s ease-out;
  }
  .eye-shape::after {
    content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at 12% 50%, rgba(170,0,0,0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 88% 50%, rgba(170,0,0,0.2) 0%, transparent 35%);
  }
  .iris {
    position: absolute; width: 38%; aspect-ratio: 1/1; left: 50%; top: 50%;
    border-radius: 50%; background: radial-gradient(circle at 45% 45%, #0a0a0a 0%, #000 60%, #1a1a1a 100%);
    transform: translate(-50%, -50%); transition: transform 0.08s ease-out;
  }
  .iris::after {
    content:""; position:absolute; width: 45%; height: 45%; left: 50%; top: 50%;
    border-radius: 50%; background: #000; transform: translate(-50%, -50%);
  }

  /* ================= 文字层（满屏幕、极端恐怖谷） ================= */
  #text-wall {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden;
  }
  
  .glitch-word {
    position: absolute;
    color: #000;
    font-weight: 900;
    font-size: clamp(30px, 8vw, 80px);
    letter-spacing: -0.05em;
    -webkit-text-stroke: 2px #8b0000; 
    text-shadow: 
      4px 4px 0 #ff0000, -4px -4px 0 #4a0000,
      0 0 20px rgba(255,0,0,0.9),
      0 0 40px rgba(255,0,0,0.6),
      0 0 80px rgba(139,0,0,0.8);
    animation: textBreathe 2s infinite alternate ease-in-out, textSkew 3s infinite alternate;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 制造文字切片、撕裂与重叠感 */
  .glitch-word::before, .glitch-word::after {
    content: "我看见你了";
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-text-stroke: 2px #ff0000;
    display: flex; align-items: center; justify-content: center;
  }
  .glitch-word::before {
    left: 4px; color: #000;
    text-shadow: -4px 0 #ff0000;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    animation: glitchSlice 0.6s infinite linear alternate-reverse;
  }
  .glitch-word::after {
    left: -4px; color: #000;
    text-shadow: 4px 0 #4a0000;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    animation: glitchSlice 1s infinite linear alternate-reverse;
  }

  /* 单字极度扭曲（由JS生成） */
  .glitch-word span {
    display: inline-block;
    transform-origin: center center;
    animation: textSpasm 0.4s infinite alternate ease-in-out;
    position: relative;
  }

  @keyframes textBreathe {
    0% { transform: scale(1.3, 0.7) skewX(6deg); }
    100% { transform: scale(0.7, 1.4) skewX(-6deg); }
  }
  @keyframes textSkew {
    0% { transform: skewY(0deg); }
    50% { transform: skewY(6deg); }
    100% { transform: skewY(-6deg); }
  }
  @keyframes textSpasm {
    0% { filter: blur(0px); transform: translateY(0px); }
    100% { filter: blur(2px); transform: translateY(4px); }
  }

  @keyframes glitchSlice {
    0% { transform: translate(0); clip-path: polygon(0 0, 100% 0, 100% 20%, 0 20%); }
    25% { transform: translate(-12px, 6px); clip-path: polygon(0 25%, 100% 25%, 100% 45%, 0 45%); }
    50% { transform: translate(12px, -6px); clip-path: polygon(0 50%, 100% 50%, 100% 70%, 0 70%); }
    75% { transform: translate(-12px, 8px); clip-path: polygon(0 75%, 100% 75%, 100% 95%, 0 95%); }
    100% { transform: translate(0); clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); }
  }

  /* 暗角 */
  .vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(circle at center, transparent 5%, rgba(0,0,0,0.95) 100%);
  }

  /* 疯狂闪烁遮罩 */
  #flash-overlay {
    position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45;
  }
  .flashing #flash-overlay { animation: flashInfinite 0.08s infinite; }
  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>

<div id="glitch-bg"></div>
<div id="scanlines"></div>
<div id="bg-eyes"></div>
<div id="eyes"></div>
<div id="text-wall"></div>
<div class="vignette"></div>
<div id="flash-overlay"></div>

<script>
  // ================= 音频系统 =================
  let audioCtx = null; let isAudioInitialized = false;
  let flickerSoundInterval = null; let reverseSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    const lowOsc = audioCtx.createOscillator(); const lowGain = audioCtx.createGain();
    const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
    lowOsc.type = 'sawtooth'; lowOsc.frequency.value = 35;
    lfo.frequency.value = 0.4; lfoGain.gain.value = 0.5;
    lfo.connect(lfoGain); lfoGain.connect(lowGain.gain);
    lowGain.gain.value = 0.15;
    lowOsc.connect(lowGain); lowGain.connect(audioCtx.destination);
    lowOsc.start(); lfo.start();

    const whisperBufferSize = audioCtx.sampleRate * 2;
    const whisperBuffer = audioCtx.createBuffer(1, whisperBufferSize, audioCtx.sampleRate);
    const whisperData = whisperBuffer.getChannelData(0);
    for (let i = 0; i < whisperBufferSize; i++) whisperData[i] = Math.random() * 2 - 1;
    const whisperSource = audioCtx.createBufferSource(); whisperSource.buffer = whisperBuffer; whisperSource.loop = true;
    const whisperFilter = audioCtx.createBiquadFilter(); whisperFilter.type = 'bandpass'; whisperFilter.frequency.value = 1000; whisperFilter.Q.value = 2;
    const whisperLfo = audioCtx.createOscillator(); const whisperLfoGain = audioCtx.createGain();
    whisperLfo.frequency.value = 0.3; whisperLfoGain.gain.value = 500;
    whisperLfo.connect(whisperLfoGain); whisperLfoGain.connect(whisperFilter.frequency);
    const whisperGain = audioCtx.createGain(); whisperGain.gain.value = 0.04;
    whisperSource.connect(whisperFilter); whisperFilter.connect(whisperGain); whisperGain.connect(audioCtx.destination);
    whisperSource.start(); whisperLfo.start();

    flickerSoundInterval = setInterval(playFlickerSound, 100);
    reverseSoundInterval = setInterval(() => { if (Math.random() > 0.6) playReverseSound(); }, 2500);
  }

  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.4) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.04);
  }

  function playReverseSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, audioCtx.currentTime); filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }

  let lastStickySoundTime = 0;
  function playStickySound() {
    if (!audioCtx) return; const now = Date.now();
    if (now - lastStickySoundTime < 50) return; lastStickySoundTime = now;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine'; osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
    filter.type = 'lowpass'; filter.frequency.value = 400;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }

  function playJumpscare() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }

  // ================= 满屏幕文字生成（恐怖谷版） =================
  function createTextWall() {
    const wall = document.getElementById('text-wall');
    wall.innerHTML = '';
    const W = window.innerWidth;
    const H = window.innerHeight;
    
    // 根据屏幕大小决定文字块数量，保证密布全屏
    const count = Math.min(40, Math.max(15, Math.floor((W * H) / 25000)));
    const text = "我看见你了";

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'glitch-word';
      
      // 随机位置，有时会重叠，增加压迫感
      const x = (Math.random() * 90 - 10); // -10vw ~ 80vw
      const y = (Math.random() * 90 - 10); // -10vh ~ 80vh
      
      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      
      // 随机旋转和缩放，让每个文字块都有不同的扭曲感
      const rotate = (Math.random() - 0.5) * 30;
      const scale = 0.8 + Math.random() * 0.6;
      el.style.transform = `rotate(${rotate}deg) scale(${scale})`;
      
      // 延迟动画，防止所有文字同时呼吸
      el.style.animationDelay = (Math.random() * -2) + 's, ' + (Math.random() * -3) + 's';
      
      // 生成内部的恐怖谷字符
      for (let j = 0; j < text.length; j++) {
        const span = document.createElement('span');
        span.textContent = text[j];
        
        // 极端的单字变形：超级拉伸、压扁、倾斜
        const rot = (Math.random() - 0.5) * 40;          // 剧烈旋转
        const xOff = (Math.random() - 0.5) * 30;         // 水平错位
        const yOff = (Math.random() - 0.5) * 40;         // 垂直错位
        const scaleX = 0.5 + Math.random() * 1.8;        // 横向拉伸
        const scaleY = 0.5 + Math.random() * 1.8;        // 纵向拉伸
        const skewX = (Math.random() - 0.5) * 30;        // 剧烈倾斜
        
        span.style.transform = `rotate(${rot}deg) translate(${xOff}px, ${yOff}px) scale(${scaleX}, ${scaleY}) skewX(${skewX}deg)`;
        span.style.animationDelay = (Math.random() * -2) + 's';
        span.style.animationDuration = (0.3 + Math.random() * 0.5) + 's';
        
        el.appendChild(span);
      }
      
      wall.appendChild(el);
    }
  }

  // ================= 背景幽灵眼 =================
  function createBgEyes() {
    const container = document.getElementById('bg-eyes');
    container.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const eye = document.createElement('div');
      eye.className = 'bg-eye';
      const size = 200 + Math.random() * 300;
      eye.style.width = size + 'px';
      eye.style.height = size * 0.5 + 'px';
      eye.style.left = (Math.random() * 80 - 10) + 'vw';
      eye.style.top = (Math.random() * 80 - 10) + 'vh';
      eye.style.animationDelay = (Math.random() * -15) + 's';
      container.appendChild(eye);
    }
  }

  // ================= 互动眼睛生成（布满全屏） =================
  const eyesLayer = document.getElementById('eyes');
  const eyes = [];

  function createEyes() {
    eyes.forEach(o => clearTimeout(o.blinkTimer)); eyes.length = 0; eyesLayer.innerHTML = '';
    const W = window.innerWidth; const H = window.innerHeight;
    
    // 全屏随机分布，数量更多
    const placed = []; 
    const targetCount = Math.min(150, Math.max(50, Math.floor((W * H) / 6000)));

    for (let i = 0; i < targetCount; i++) {
      let x, y, w, h, cx, cy, ok = false, tries = 0;
      
      // 全屏随机位置
      while (!ok && tries < 50) {
        x = Math.random() * 100; // 0vw ~ 100vw
        y = Math.random() * 100; // 0vh ~ 100vh
        w = 25 + Math.random() * 35; // 眼睛稍微小一点，保证数量多
        h = w * 0.46;
        cx = (x / 100) * W; cy = (y / 100) * H;
        
        ok = true;
        // 防止重叠得太厉害，但允许轻微堆叠
        for (const p of placed) { 
          if (Math.hypot(cx - p.cx, cy - p.cy) < (w + p.w) * 0.4) { 
            ok = false; break; 
          } 
        }
        tries++;
      }
      
      if (!ok) continue;
      placed.push({ cx, cy, w });

      const el = document.createElement('div'); el.className = 'eye';
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.left = x + 'vw'; el.style.top = y + 'vh';

      const shape = document.createElement('div'); shape.className = 'eye-shape';
      const iris = document.createElement('div'); iris.className = 'iris';
      shape.appendChild(iris); el.appendChild(shape); eyesLayer.appendChild(el);

      const obj = { el, shape, iris, openY: 1, blinking: false, blinkTimer: null };
      eyes.push(obj);

      el.addEventListener('pointerdown', function (e) { e.stopPropagation(); triggerBlink(obj); });
      scheduleAutoBlink(obj);
    }
  }

  function triggerBlink(obj) {
    if (obj.blinking) return; obj.blinking = true;
    obj.shape.style.transition = 'transform 0.07s ease-in'; obj.shape.style.transform = 'scaleY(0.05)';
    setTimeout(() => {
      obj.shape.style.transition = 'transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1.2)';
      obj.shape.style.transform = 'scaleY(' + obj.openY + ')';
      setTimeout(() => { obj.blinking = false; }, 150);
    }, 80);
  }

  function scheduleAutoBlink(obj) {
    const delay = 1500 + Math.random() * 6000;
    obj.blinkTimer = setTimeout(() => { if (!obj.blinking) triggerBlink(obj); scheduleAutoBlink(obj); }, delay);
  }

  function handleMove(e) {
    initAudio();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
    else { clientX = e.clientX; clientY = e.clientY; }

    const H = window.innerHeight;
    eyes.forEach(obj => {
      const rect = obj.el.getBoundingClientRect();
      const ex = rect.left + rect.width / 2; const ey = rect.top + rect.height / 2;
      const angle = Math.atan2(clientY - ey, clientX - ex);
      const maxShift = rect.width * 0.14;
      obj.iris.style.transform = 'translate(calc(-50% + ' + Math.cos(angle) * maxShift + 'px), calc(-50% + ' + Math.sin(angle) * maxShift + 'px))';

      const normY = Math.max(-1, Math.min(1, (clientY - ey) / (H * 0.45)));
      let openY = 1 - normY * 0.20; openY = Math.max(0.72, Math.min(1.30, openY));
      obj.openY = openY;
      if (!obj.blinking) obj.shape.style.transform = 'scaleY(' + openY + ')';
    });
    playStickySound();
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });

  // 初始化
  createBgEyes();
  createEyes();
  createTextWall();

  setTimeout(() => {
    initAudio(); document.body.classList.add('flashing');
    document.querySelectorAll('.eye').forEach(el => el.classList.add('spawned'));
    playJumpscare();
  }, 1500);

  let resizeTimer;
  window.addEventListener('resize', () => { 
    clearTimeout(resizeTimer); 
    resizeTimer = setTimeout(() => { 
      createBgEyes(); 
      createEyes(); 
      createTextWall(); 
    }, 300); 
  });
</script>

</body>
</html>
