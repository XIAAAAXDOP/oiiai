<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }

  /* ---------- 眼睛层 ---------- */
  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  .eye {
    position:absolute;
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    pointer-events:none;
    will-change:transform,opacity;
    filter:drop-shadow(0 0 14px rgba(0,0,0,.65));
    animation:drift linear infinite;
  }

  @keyframes drift {
    0% {
      transform:translate(0,0) scale(1) rotate(var(--rot));
      opacity:.18;
    }
    50% {
      transform:translate(var(--dx),var(--dy)) scale(1.18) rotate(calc(var(--rot) + 8deg));
      opacity:1;
    }
    100% {
      transform:translate(0,0) scale(1) rotate(var(--rot));
      opacity:.18;
    }
  }

  /* ---------- 暗角 ---------- */
  .vignette {
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- 文字层 ---------- */
  .text-wrap {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:6vw; pointer-events:none;
  }

  .text {
    max-width:1000px;
    color:#000;                 /* 黑字 */
    font-weight:900;            /* 加粗黑 */
    font-size:clamp(24px,5.5vw,58px);
    line-height:1.6;
    text-align:center;
    letter-spacing:.08em;
    text-shadow:0 0 2px rgba(0,0,0,.45);
  }

  /* 每个字独立颤抖 */
  .ch {
    display:inline-block;
    transform-origin:50% 50%;
    will-change:transform;
    animation:jitter .12s linear infinite;
  }

  @keyframes jitter {
    0%, 100% { transform:translate(0,0) rotate(0deg); }
    25%      { transform:translate(var(--ax), var(--ay)) rotate(var(--ar)); }
    50%      { transform:translate(calc(var(--ax) * -1), var(--ay)) rotate(calc(var(--ar) * -1)); }
    75%      { transform:translate(var(--ay), calc(var(--ax) * -1)) rotate(var(--ar)); }
  }
</style>
</head>
<body>

<div id="eyes"></div>
<div class="vignette"></div>

<div class="text-wrap">
  <div class="text"></div>
</div>

<script>
  /* ============================================================
     ① 眼睛图片
     想用自己的图片：把 CUSTOM_EYE_IMG 改成图片地址即可，例如：
        const CUSTOM_EYE_IMG = "eye.png";
        const CUSTOM_EYE_IMG = "https://xxx.com/eyes.png";
     留空则使用下面内置的 SVG 眼睛。
     ============================================================ */
  const CUSTOM_EYE_IMG = "eye.png";

  const EYE_SVG = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
    <defs>
      <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7a0000"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>
    </defs>
    <ellipse cx="100" cy="50" rx="94" ry="46" fill="#f4f4f4"/>
    <ellipse cx="100" cy="50" rx="94" ry="46" fill="none" stroke="#101010" stroke-width="6"/>
    <circle cx="100" cy="50" r="36" fill="#000"/>
    <circle cx="100" cy="50" r="28" fill="url(#pupil)"/>
    <circle cx="86" cy="36" r="9" fill="#ffffff" opacity="0.92"/>
  </svg>`;

  const EYE_IMG = CUSTOM_EYE_IMG ||
    ("data:image/svg+xml;charset=utf-8," + encodeURIComponent(EYE_SVG));

  /* ============================================================
     ② 生成眼睛
     ============================================================ */
  const eyesLayer = document.getElementById('eyes');

  function createEyes() {
    eyesLayer.innerHTML = '';

    const area = window.innerWidth * window.innerHeight;
    const count = Math.min(120, Math.max(40, Math.floor(area / 12000)));

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'eye';

      const w = Math.random() * 140 + 55;   // 眼睛宽度
      const h = w * 0.5;                    // 图片宽高比 2:1
      const x = Math.random() * 110 - 5;
      const y = Math.random() * 110 - 5;
      const rot = (Math.random() - 0.5) * 40;
      const dx = (Math.random() - 0.5) * 120;
      const dy = (Math.random() - 0.5) * 120;
      const dur = Math.random() * 9 + 7;
      const delay = Math.random() * -16;

      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      el.style.backgroundImage = 'url("' + EYE_IMG + '")';
      el.style.setProperty('--rot', rot + 'deg');
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = delay + 's';

      eyesLayer.appendChild(el);
    }
  }

  createEyes();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(createEyes, 300);
  });

  /* ============================================================
     ③ 文字逐字拆分 + 随机颤抖参数
     ============================================================ */
  const LINES = [
    "我很痛苦",
    "我感觉到我的灵魂似乎割裂了",
    "所有人都这么做吗",
    "我不理解",
    "究竟是我脑子出问题了",
    "还是他们都不正常呢？"
  ];

  const textEl = document.querySelector('.text');

  textEl.innerHTML = LINES.map(line =>
    Array.from(line)
      .map(ch => '<span class="ch">' + ch + '</span>')
      .join('')
  ).join('<br>');

  document.querySelectorAll('.ch').forEach(el => {
    // 颤抖幅度（越大越剧烈）
    const ax = (Math.random() * 2 - 1) * 20;   // 水平位移 ±20px
    const ay = (Math.random() * 2 - 1) * 18;   // 垂直位移 ±18px
    const ar = (Math.random() * 2 - 1) * 16;   // 旋转 ±16deg

    el.style.setProperty('--ax', ax.toFixed(1) + 'px');
    el.style.setProperty('--ay', ay.toFixed(1) + 'px');
    el.style.setProperty('--ar', ar.toFixed(1) + 'deg');

    // 每个字速度/相位都不同，错落感更强
    el.style.animationDuration = (0.08 + Math.random() * 0.09).toFixed(3) + 's';
    el.style.animationDelay = (-Math.random() * 0.3).toFixed(3) + 's';
  });
</script>

</body>
</html>
