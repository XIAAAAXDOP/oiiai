<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  /* 惊悚眼眶：不规则多边形裁切，统一内眼角朝左 */
  .eye {
    position:absolute;
    background: #fff;
    clip-path: polygon(
      0% 50%,      /* 内眼角（左侧尖锐） */
      10% 20%,     /* 上边缘内侧 */
      30% 8%,      /* 上边缘中内 */
      55% 5%,      /* 上边缘中外 */
      85% 15%,     /* 上边缘外侧 */
      100% 45%,    /* 外眼角（右侧） */
      90% 75%,     /* 下边缘外侧 */
      65% 95%,     /* 下边缘中外 */
      35% 92%,     /* 下边缘中内 */
      15% 80%      /* 下边缘内侧 */
    );
    box-shadow: inset 0 0 15px rgba(180, 0, 0, 0.9), inset 0 0 5px rgba(255, 0, 0, 0.5);
    opacity: 0;
    transform: scale(0);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.9));
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* 眼珠：纯黑色 */
  .pupil {
    position: absolute;
    width: 35%;
    height: 65%;
    background: #000;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    box-shadow: 0 0 8px #000;
  }

  /* 红血丝细节 */
  .eye::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(150, 0, 0, 0.4) 0%, transparent 20%),
      radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.3) 0%, transparent 25%),
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(100, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  .eye.spawned {
    opacity: 1;
    transform: scale(1);
    animation: shake 0.12s linear infinite;
  }

  @keyframes shake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(1deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-1deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0.5deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  .vignette {
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);
  }

  /* 文字：黑色加粗黑体 */
  .text-wrap {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw;
    pointer-events:none;
  }

  .text {
    max-width:1000px;
    color:#000;
    font-weight:900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size:clamp(32px, 8vw, 80px);
    line-height:1.55;
    text-align:center;
    letter-spacing:.06em;
    text-shadow: none;
  }

  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flashing #flash-overlay {
    animation: flashInfinite 0.12s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
  }

  .flashing .text {
    animation: textFlash 0.12s infinite;
  }
  @keyframes textFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette"></div>

<!-- 这里已经改成了“我看见你了” -->
<div class="text-wrap">
  <div class="text">我看见你了</div>
</div>

<script>
  // ================= 音频系统 =================
  let audioCtx = null;
  let isAudioInitialized = false;
  let flickerSoundInterval = null;
  let reverseSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // 1. 低频环境轰鸣
    const lowOsc = audioCtx.createOscillator();
    const lowGain = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lowOsc.type = 'sawtooth';
    lowOsc.frequency.value = 40;
    lfo.frequency.value = 0.4;
    lfoGain.gain.value = 0.5;
    lfo.connect(lfoGain);
    lfoGain.connect(lowGain.gain);
    lowGain.gain.value = 0.15;
    lowOsc.connect(lowGain);
    lowGain.connect(audioCtx.destination);
    lowOsc.start();
    lfo.start();

    // 2. 人在低声细语（带通滤波白噪声 + LFO 调制）
    const whisperBufferSize = audioCtx.sampleRate * 2;
    const whisperBuffer = audioCtx.createBuffer(1, whisperBufferSize, audioCtx.sampleRate);
    const whisperData = whisperBuffer.getChannelData(0);
    for (let i = 0; i < whisperBufferSize; i++) {
        whisperData[i] = Math.random() * 2 - 1;
    }
    const whisperSource = audioCtx.createBufferSource();
    whisperSource.buffer = whisperBuffer;
    whisperSource.loop = true;
    const whisperFilter = audioCtx.createBiquadFilter();
    whisperFilter.type = 'bandpass';
    whisperFilter.frequency.value = 1000;
    whisperFilter.Q.value = 2;
    const whisperLfo = audioCtx.createOscillator();
    const whisperLfoGain = audioCtx.createGain();
    whisperLfo.frequency.value = 0.3;
    whisperLfoGain.gain.value = 500;
    whisperLfo.connect(whisperLfoGain);
    whisperLfoGain.connect(whisperFilter.frequency);
    const whisperGain = audioCtx.createGain();
    whisperGain.gain.value = 0.04;
    whisperSource.connect(whisperFilter);
    whisperFilter.connect(whisperGain);
    whisperGain.connect(audioCtx.destination);
    whisperSource.start();
    whisperLfo.start();

    // 3. 无限闪烁电流声
    flickerSoundInterval = setInterval(playFlickerSound, 130);
    
    // 4. 随机混乱倒放声
    reverseSoundInterval = setInterval(() => {
      if (Math.random() > 0.6) playReverseSound();
    }, 3000);
  }

  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.3) return; 
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function playReverseSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  let lastStickySoundTime = 0;
  function playStickySound() {
    if (!audioCtx) return;
    const now = Date.now();
    if (now - lastStickySoundTime < 50) return;
    lastStickySoundTime = now;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playJumpscare() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // ================= 视觉与交互系统 =================
  const eyesLayer = document.getElementById('eyes');

  function createEyes() {
    eyesLayer.innerHTML = '';
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const regions = [
      { xMin: 5, xMax: 95, yMin: 5, yMax: 20 },
      { xMin: 5, xMax: 95, yMin: 80, yMax: 95 },
      { xMin: 5, xMax: 15, yMin: 20, yMax: 80 },
      { xMin: 85, xMax: 95, yMin: 20, yMax: 80 }
    ];
    const placedEyes = []; 
    const eyeCount = Math.min(30, Math.max(12, Math.floor(screenW / 50))); 

    for (let i = 0; i < eyeCount; i++) {
      const region = regions[i % regions.length];
      let x, y, w, h, cx, cy;
      let validPlacement = false;
      let attempts = 0;

      while (!validPlacement && attempts < 50) {
        x = region.xMin + Math.random() * (region.xMax - region.xMin); 
        y = region.yMin + Math.random() * (region.yMax - region.yMin); 
        w = Math.random() * 90 + 50; 
        h = w * 0.45; 
        cx = (x / 100) * screenW;
        cy = (y / 100) * screenH;
        let tooClose = false;
        for (let eye of placedEyes) {
          const dist = Math.hypot(cx - eye.cx, cy - eye.cy);
          if (dist < (w + eye.w) * 0.9) { 
            tooClose = true;
            break;
          }
        }
        if (!tooClose) validPlacement = true;
        attempts++;
      }
      if (!validPlacement) continue;
      placedEyes.push({ cx, cy, w });

      const el = document.createElement('div');
      el.className = 'eye';
      const pupil = document.createElement('div');
      pupil.className = 'pupil';
      el.appendChild(pupil);
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      el.dataset.cx = cx;
      el.dataset.cy = cy;
      eyesLayer.appendChild(el);
    }
  }

  function handleMove(e) {
    initAudio();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      const eyeWidth = parseFloat(eye.style.width);
      const maxShift = eyeWidth * 0.22; 
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      let scaleFactor = 1;
      const normalizedDy = dy / eyeWidth; 
      if (normalizedDy < 0) {
        scaleFactor = 1 + Math.abs(normalizedDy) * 2.0; 
      } else {
        scaleFactor = 1 - normalizedDy * 1.6; 
      }
      scaleFactor = Math.min(1.45, Math.max(0.65, scaleFactor));
      
      const pupil = eye.querySelector('.pupil');
      if (pupil) {
        pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scaleFactor})`;
      }
    });
    playStickySound();
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });

  createEyes();

  setTimeout(() => {
    initAudio(); 
    document.body.classList.add('flashing');
    document.querySelectorAll('.eye').forEach(eye => {
      eye.classList.add('spawned');
    });
    playJumpscare();
  }, 1500);

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(createEyes, 300);
  });
</script>

</body>
</html>
