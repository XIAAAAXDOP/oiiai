<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  /* 眼睛容器，不阻挡点击穿透 */
  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events: none; }

  /* 眼睛外框：不规则多边形裁剪，自带内眼角，深邃且血红 */
  .eye-wrapper {
    position:absolute;
    background: #fff;
    /* 不规则眼眶：左侧尖锐内眼角，上下边缘扭曲 */
    clip-path: polygon(
      0% 50%, 10% 20%, 30% 8%, 60% 5%, 85% 15%, 
      100% 40%, 90% 70%, 65% 92%, 35% 95%, 10% 80%
    );
    box-shadow: inset 0 0 15px rgba(180, 0, 0, 0.9), inset 0 0 5px rgba(255, 0, 0, 0.5);
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9));
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: auto; /* 恢复点击 */
    cursor: crosshair;
  }

  .eye-wrapper.spawned {
    opacity: 1;
    transform: scale(1);
    animation: eyeShake 0.15s linear infinite;
  }

  @keyframes eyeShake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(0.5deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-0.5deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  /* 眼球（白色眼白） */
  .eyeball {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 红血丝细节 */
  .eyeball::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(150, 0, 0, 0.4) 0%, transparent 20%),
      radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.3) 0%, transparent 25%),
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(100, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  /* 眼珠（纯黑色） */
  .pupil {
    position: absolute;
    width: 38%;
    height: 65%;
    background: #000;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    box-shadow: 0 0 8px #000;
  }

  /* 眼皮机制：上下眼皮，默认缩到边缘，眨眼时关闭 */
  .upper-lid, .lower-lid {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    background: #000; /* 眼皮颜色，可与背景融合或纯黑 */
    z-index: 5;
    transform-origin: top;
    transition: transform 0.1s ease;
  }
  .lower-lid {
    bottom: 0;
    transform-origin: bottom;
  }
  .upper-lid { top: 0; }
  
  /* 默认睁开状态，只占一点点 */
  .upper-lid { transform: scaleY(0.15); }
  .lower-lid { transform: scaleY(0.15); }

  /* 眨眼状态 */
  .eye-wrapper.blinking .upper-lid { transform: scaleY(1); }
  .eye-wrapper.blinking .lower-lid { transform: scaleY(1); }

  /* 向上看（睁大） */
  .eye-wrapper.look-up .upper-lid { transform: scaleY(0.05); }
  .eye-wrapper.look-up .lower-lid { transform: scaleY(0.05); }

  /* 向下看（微眯） */
  .eye-wrapper.look-down .upper-lid { transform: scaleY(0.35); }
  .eye-wrapper.look-down .lower-lid { transform: scaleY(0.35); }


  /* 文字样式：黑字加粗，蓝边，故障错乱效果 */
  .text-wrap {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw;
    pointer-events:none;
  }

  .text {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2vw;
    max-width: 1000px;
  }

  .text span {
    display: inline-block;
    color: #000;
    font-weight: 900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size: clamp(40px, 12vw, 100px);
    /* 蓝边和发光 */
    -webkit-text-stroke: 3px #00ffff;
    text-shadow: 
      3px 3px 0 #0000ff, 
      -3px -3px 0 #00ffff, 
      0 0 15px #0000ff,
      0 0 30px #0000ff;
    /* 不规则变形 */
    transform: rotate(var(--rot, 0deg)) skewX(var(--skew, 0deg)) translateY(var(--dy, 0px));
    animation: textGlitch 0.2s infinite alternate;
  }

  /* 每个字的随机动态 */
  .text span:nth-child(1) { --rot: -5deg; --skew: 10deg; --dy: -5px; animation-delay: 0.1s; }
  .text span:nth-child(2) { --rot: 8deg; --skew: -15deg; --dy: 10px; animation-delay: 0.3s; }
  .text span:nth-child(3) { --rot: -3deg; --skew: 5deg; --dy: -8px; animation-delay: 0.5s; }
  .text span:nth-child(4) { --rot: 6deg; --skew: -8deg; --dy: 5px; animation-delay: 0.2s; }
  .text span:nth-child(5) { --rot: -8deg; --skew: 12deg; --dy: -10px; animation-delay: 0.4s; }

  @keyframes textGlitch {
    0% { opacity: 0.9; transform: rotate(var(--rot)) skewX(var(--skew)) translateY(var(--dy)) scale(1); }
    100% { opacity: 1; transform: rotate(calc(var(--rot) * -1)) skewX(calc(var(--skew) * -1)) translateY(calc(var(--dy) * -1)) scale(1.05); }
  }

  /* 闪烁遮罩层 */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flashing #flash-overlay {
    animation: flashInfinite 0.12s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
  }

  .flashing .text span {
    animation-duration: 0.08s; /* 闪烁时文字加速抖动 */
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette" style="position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);"></div>

<div class="text-wrap">
  <div class="text">
    <span>我</span><span>看</span><span>见</span><span>你</span><span>了</span>
  </div>
</div>

<script>
  // ================= 音频系统 =================
  let audioCtx = null;
  let isAudioInitialized = false;
  let flickerSoundInterval = null;
  let reverseSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // 1. 低频环境轰鸣
    const lowOsc = audioCtx.createOscillator();
    const lowGain = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lowOsc.type = 'sawtooth';
    lowOsc.frequency.value = 40;
    lfo.frequency.value = 0.4;
    lfoGain.gain.value = 0.5;
    lfo.connect(lfoGain);
    lfoGain.connect(lowGain.gain);
    lowGain.gain.value = 0.15;
    lowOsc.connect(lowGain);
    lowGain.connect(audioCtx.destination);
    lowOsc.start();
    lfo.start();

    // 2. 低声细语
    const whisperBufferSize = audioCtx.sampleRate * 2;
    const whisperBuffer = audioCtx.createBuffer(1, whisperBufferSize, audioCtx.sampleRate);
    const whisperData = whisperBuffer.getChannelData(0);
    for (let i = 0; i < whisperBufferSize; i++) whisperData[i] = Math.random() * 2 - 1;
    const whisperSource = audioCtx.createBufferSource();
    whisperSource.buffer = whisperBuffer;
    whisperSource.loop = true;
    const whisperFilter = audioCtx.createBiquadFilter();
    whisperFilter.type = 'bandpass';
    whisperFilter.frequency.value = 1000;
    whisperFilter.Q.value = 2;
    const whisperLfo = audioCtx.createOscillator();
    const whisperLfoGain = audioCtx.createGain();
    whisperLfo.frequency.value = 0.3;
    whisperLfoGain.gain.value = 500;
    whisperLfo.connect(whisperLfoGain);
    whisperLfoGain.connect(whisperFilter.frequency);
    const whisperGain = audioCtx.createGain();
    whisperGain.gain.value = 0.04;
    whisperSource.connect(whisperFilter);
    whisperFilter.connect(whisperGain);
    whisperGain.connect(audioCtx.destination);
    whisperSource.start();
    whisperLfo.start();

    // 3. 闪烁电流声
    flickerSoundInterval = setInterval(playFlickerSound, 130);
    
    // 4. 随机混乱倒放声
    reverseSoundInterval = setInterval(() => {
      if (Math.random() > 0.6) playReverseSound();
    }, 3000);
  }

  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.3) return; 
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function playReverseSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  // 眨眼音效（短促粘稠声）
  function playBlinkSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  // 手指滑动的粘稠声
  let lastStickySoundTime = 0;
  function playStickySound() {
    if (!audioCtx) return;
    const now = Date.now();
    if (now - lastStickySoundTime < 60) return;
    lastStickySoundTime = now;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  // 惊吓爆发声
  function playJumpscare() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // ================= 视觉与交互系统 =================
  const eyesLayer = document.getElementById('eyes');
  let allEyes = [];

  // 眨眼动作
  function blinkEye(eyeEl, playSound = true) {
    if (eyeEl.classList.contains('blinking')) return;
    eyeEl.classList.add('blinking');
    if (playSound) playBlinkSound();
    
    setTimeout(() => {
      eyeEl.classList.remove('blinking');
    }, 120); // 120ms 完成一次眨眼
  }

  function createEyes() {
    eyesLayer.innerHTML = '';
    allEyes = [];

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    
    // 生成更多眼睛（约 40-60 只，视屏幕大小而定）
    const eyeCount = Math.min(60, Math.max(20, Math.floor(screenW * screenH / 15000))); 

    for (let i = 0; i < eyeCount; i++) {
      // 随机分布在四周区域，避开中心文字
      let x, y, w;
      let validPlacement = false;
      let attempts = 0;

      while (!validPlacement && attempts < 50) {
        // 随机位置：屏幕边缘 20% 范围内，避开中间
        const edge = Math.floor(Math.random() * 4); // 0上 1下 2左 3右
        if (edge === 0) { x = Math.random() * 100; y = Math.random() * 20; }
        else if (edge === 1) { x = Math.random() * 100; y = 80 + Math.random() * 20; }
        else if (edge === 2) { x = Math.random() * 20; y = 20 + Math.random() * 60; }
        else { x = 80 + Math.random() * 20; y = 20 + Math.random() * 60; }

        w = Math.random() * 80 + 50; // 眼睛宽 50~130px

        // 简单防重叠
        let tooClose = false;
        for (let e of allEyes) {
          const dist = Math.hypot(x - e.x, y - e.y);
          if (dist < (w / screenW * 100) * 1.5) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) validPlacement = true;
        attempts++;
      }

      if (!validPlacement) continue;

      const wrapper = document.createElement('div');
      wrapper.className = 'eye-wrapper';
      wrapper.style.width = w + 'px';
      wrapper.style.height = (w * 0.45) + 'px';
      wrapper.style.left = x + 'vw';
      wrapper.style.top = y + 'vh';
      
      // 鼠标和触摸交互绑定
      wrapper.addEventListener('click', (e) => {
        e.stopPropagation();
        blinkEye(wrapper);
      });
      wrapper.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        blinkEye(wrapper);
      }, { passive: true });

      const eyeball = document.createElement('div');
      eyeball.className = 'eyeball';
      
      const pupil = document.createElement('div');
      pupil.className = 'pupil';
      eyeball.appendChild(pupil);

      const upperLid = document.createElement('div');
      upperLid.className = 'upper-lid';
      const lowerLid = document.createElement('div');
      lowerLid.className = 'lower-lid';

      wrapper.appendChild(eyeball);
      wrapper.appendChild(upperLid);
      wrapper.appendChild(lowerLid);

      wrapper.dataset.cx = (x / 100) * screenW;
      wrapper.dataset.cy = (y / 100) * screenH;
      wrapper.dataset.w = w;

      eyesLayer.appendChild(wrapper);
      
      allEyes.push({
        el: wrapper,
        pupil: pupil,
        upperLid: upperLid,
        lowerLid: lowerLid,
        x: x, y: y, w: w,
        cx: (x / 100) * screenW,
        cy: (y / 100) * screenH
      });
    }
  }

  // 全局鼠标/触摸跟踪
  function handleMove(e) {
    initAudio();

    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    allEyes.forEach(eye => {
      const eyeX = eye.cx;
      const eyeY = eye.cy;
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      
      const maxShift = eye.w * 0.15; // 眼珠最大偏移量
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      // 移动瞳孔
      eye.pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

      // 动态调整眼皮（上下看）
      if (dy < -maxShift * 0.5) {
        // 视线向上，眼皮睁开
        eye.upperLid.style.transform = 'scaleY(0.05)';
        eye.lowerLid.style.transform = 'scaleY(0.05)';
      } else if (dy > maxShift * 0.5) {
        // 视线向下，眼皮微闭
        eye.upperLid.style.transform = 'scaleY(0.4)';
        eye.lowerLid.style.transform = 'scaleY(0.4)';
      } else {
        // 平视，默认
        eye.upperLid.style.transform = 'scaleY(0.15)';
        eye.lowerLid.style.transform = 'scaleY(0.15)';
      }
    });

    playStickySound();
  }

  // 随机错落眨眼（防止同时眨眼）
  setInterval(() => {
    if (allEyes.length === 0) return;
    // 每次随机挑 1 到 2 只眼睛眨眼
    const count = Math.floor(Math.random() * 2) + 1;
    for (let i = 0; i < count; i++) {
      const randomEye = allEyes[Math.floor(Math.random() * allEyes.length)];
      // 确保不打断正在眨眼的眼睛
      if (!randomEye.el.classList.contains('blinking')) {
        blinkEye(randomEye.el, false); // 自动眨眼不播声音，避免嘈杂
      }
    }
  }, 1500); // 每 1.5 秒触发一次随机眨眼

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });

  createEyes();

  // 1.5秒后：开始疯狂闪烁，眼睛出现，伴随惊吓音效
  setTimeout(() => {
    initAudio(); 
    document.body.classList.add('flashing');
    
    allEyes.forEach(eye => {
      eye.el.classList.add('spawned');
    });

    playJumpscare();
    
    // 让眼睛交错出现
    allEyes.forEach((eye, index) => {
      eye.el.style.transitionDelay = (index * 0.02) + 's';
    });
    
  }, 1500);

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(createEyes, 300);
  });
</script>

</body>
