<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  /* 眼睛容器 */
  .eye {
    position:absolute;
    pointer-events: none;
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 眼睛形状：更真实的椭圆眼，带球面感和眼睑阴影 */
  .eye-shape {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #fff 30%, #d9d9d9 80%, #b3b3b3 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* 模拟真实眼型，上下不对称 */
    box-shadow: 
      inset 0 0 20px rgba(0, 0, 0, 0.8), /* 眼睑阴影 */
      inset 0 0 5px rgba(255, 0, 0, 0.6), /* 红血丝边缘 */
      0 0 10px rgba(0,0,0,0.8); 
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    overflow: hidden;
  }

  /* 红血丝 */
  .eye-shape::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 15% 30%, rgba(180, 0, 0, 0.6) 0%, transparent 30%),
      radial-gradient(circle at 85% 70%, rgba(200, 0, 0, 0.5) 0%, transparent 35%);
    pointer-events: none;
  }

  /* 黑眼珠（瞳孔） */
  .pupil {
    position: absolute;
    width: 38%;
    height: 68%;
    background: radial-gradient(circle at center, #000 60%, #1a1a1a 100%);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    box-shadow: inset 0 0 5px rgba(0,0,0,1);
  }

  /* 眼睛出现 */
  .eye.spawned {
    opacity: 1;
    transform: scale(1);
    animation: shake 0.15s linear infinite;
  }

  @keyframes shake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(1deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-1deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0.5deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  /* 独立眨眼动画 */
  .eye-shape.blinking {
    animation: blinkAnim 0.2s ease-in-out;
  }
  @keyframes blinkAnim {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.05); }
  }

  .vignette {
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);
  }

  /* 文字层 */
  .text-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
  }

  /* 不规则的文字样式 */
  .creepy-text {
    position: absolute;
    color: #000; /* 黑字 */
    font-weight: 900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size: clamp(30px, 8vw, 80px);
    letter-spacing: 0.1em;
    white-space: nowrap;
    /* 加蓝边 */
    -webkit-text-stroke: 2px #0000ff; 
    text-shadow: 
      0 0 10px #0000ff,
      0 0 20px #0000ff;
  }

  /* 闪烁遮罩 */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flashing #flash-overlay {
    animation: flashInfinite 0.15s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.5; }
  }

  .flashing .creepy-text {
    animation: textFlash 0.15s infinite;
  }
  @keyframes textFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette"></div>

<div class="text-layer" id="textLayer"></div>

<script>
  // ================= 音频系统（恢复为突出人声和眼珠声的版本） =================
  let audioCtx = null;
  let isAudioInitialized = false;
  let flickerSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // 1. 背景不适音：双频拍频（50Hz + 53Hz） + 高频耳鸣
    const lowOsc1 = audioCtx.createOscillator();
    const lowOsc2 = audioCtx.createOscillator();
    const lowGain = audioCtx.createGain();
    lowOsc1.type = 'sine'; lowOsc1.frequency.value = 50;
    lowOsc2.type = 'sine'; lowOsc2.frequency.value = 53;
    lowGain.gain.value = 0.08;
    lowOsc1.connect(lowGain); lowOsc2.connect(lowGain); lowGain.connect(audioCtx.destination);
    lowOsc1.start(); lowOsc2.start();

    const tinnitusOsc = audioCtx.createOscillator();
    const tinnitusGain = audioCtx.createGain();
    tinnitusOsc.type = 'sine'; tinnitusOsc.frequency.value = 8000;
    tinnitusGain.gain.value = 0.015;
    tinnitusOsc.connect(tinnitusGain); tinnitusGain.connect(audioCtx.destination);
    tinnitusOsc.start();

    // 2. 突出人声：模糊低语
    const whisperBufferSize = audioCtx.sampleRate * 4;
    const whisperBuffer = audioCtx.createBuffer(1, whisperBufferSize, audioCtx.sampleRate);
    const whisperData = whisperBuffer.getChannelData(0);
    for (let i = 0; i < whisperBufferSize; i++) whisperData[i] = Math.random() * 2 - 1;
    const whisperSource = audioCtx.createBufferSource();
    whisperSource.buffer = whisperBuffer; whisperSource.loop = true;
    
    const whisperFilter = audioCtx.createBiquadFilter();
    whisperFilter.type = 'bandpass'; whisperFilter.frequency.value = 1200; whisperFilter.Q.value = 8;
    
    const whisperLfo = audioCtx.createOscillator();
    const whisperLfoGain = audioCtx.createGain();
    whisperLfo.frequency.value = 5; whisperLfoGain.gain.value = 800;
    whisperLfo.connect(whisperLfoGain); whisperLfoGain.connect(whisperFilter.frequency);
    
    const whisperGain = audioCtx.createGain();
    whisperGain.gain.value = 0.25; // 突出人声
    
    whisperSource.connect(whisperFilter); whisperFilter.connect(whisperGain); whisperGain.connect(audioCtx.destination);
    whisperSource.start(); whisperLfo.start();

    flickerSoundInterval = setInterval(playFlickerSound, 150);
  }

  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.4) return; 
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }

  // 放大眼珠声音：眨眼声
  function playBlinkSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); // 音量放大
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.06);
  }

  // 放大眼珠声音：湿润粘稠滑动声
  let lastStickySoundTime = 0;
  function playStickySound() {
    if (!audioCtx) return;
    const now = Date.now();
    if (now - lastStickySoundTime < 60) return;
    lastStickySoundTime = now;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200 + Math.random() * 150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
    filter.type = 'lowpass'; filter.frequency.value = 600;
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime); // 音量放大
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  function playJumpscare() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }

  // ================= 视觉与交互系统 =================
  const eyesLayer = document.getElementById('eyes');

  // 1. 生成不规则分布的文字
  function createTexts() {
    const textLayer = document.getElementById('textLayer');
    textLayer.innerHTML = '';
    
    for (let i = 0; i < 6; i++) {
      const el = document.createElement('div');
      el.className = 'creepy-text';
      el.innerText = '我看见你了';
      
      // 随机位置、旋转、大小
      el.style.left = (Math.random() * 80 + 10) + '%';
      el.style.top = (Math.random() * 80 + 10) + '%';
      el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 40 - 20}deg) scale(${Math.random() * 0.6 + 0.6})`;
      
      textLayer.appendChild(el);
    }
  }

  // 2. 生成眼睛
  function createEyes() {
    eyesLayer.innerHTML = '';
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    
    const gridSize = 70; // 略微扩大间距，防止眼睛挤在一起
    const cols = Math.floor(screenW / gridSize);
    const rows = Math.floor(screenH / gridSize);
    const totalCells = cols * rows;
    
    const eyeCount = Math.floor(totalCells * 0.35); 
    const placedEyes = [];
    
    let attempts = 0;
    while (placedEyes.length < eyeCount && attempts < 500) {
      attempts++;
      const col = Math.floor(Math.random() * cols);
      const row = Math.floor(Math.random() * rows);
      
      const cx = (col + 0.5) * gridSize + (Math.random() * 20 - 10);
      const cy = (row + 0.5) * gridSize + (Math.random() * 20 - 10);
      
      const w = Math.random() * 60 + 40; 
      const h = w * 0.45;

      let tooClose = false;
      for (let eye of placedEyes) {
        const dist = Math.hypot(cx - eye.cx, cy - eye.cy);
        if (dist < (w + eye.w) * 0.8) { 
          tooClose = true;
          break;
        }
      }

      if (!tooClose) {
        placedEyes.push({ cx, cy, w });

        const el = document.createElement('div');
        el.className = 'eye';
        
        const eyeShape = document.createElement('div');
        eyeShape.className = 'eye-shape';
        
        const pupil = document.createElement('div');
        pupil.className = 'pupil';
        
        eyeShape.appendChild(pupil);
        el.appendChild(eyeShape);

        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';

        eyesLayer.appendChild(el);
        
        // 每只眼睛独立开启随机眨眼机制
        scheduleBlink(el, eyeShape);
      }
    }
  }

  // 独立的随机眨眼机制（防止同时眨眼）
  function scheduleBlink(eyeEl, shapeEl) {
    const delay = Math.random() * 4000 + 1500; // 1.5秒到5.5秒之间随机
    setTimeout(() => {
      if (shapeEl && !shapeEl.classList.contains('blinking')) {
        shapeEl.classList.add('blinking');
        // 只有离得近的眼睛被点击才播放声音，或者独立眨眼时极低概率播放，这里让独立眨眼不发声，仅点击发声
        setTimeout(() => {
          shapeEl.classList.remove('blinking');
        }, 200);
      }
      scheduleBlink(eyeEl, shapeEl); // 递归调用，继续下一次随机眨眼
    }, delay);
  }

  // 3. 滑动交互（眼球追踪与眼皮缩放）
  function handleMove(e) {
    initAudio();
    let clientX, clientY;
    
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      const eyeWidth = parseFloat(eye.style.width);
      
      const maxShift = eyeWidth * 0.2; 
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      let pupilScale = 1;
      let eyelidScale = 1;
      const normalizedDy = dy / eyeWidth; 
      
      if (normalizedDy < 0) {
        // 向上看：瞳孔放大，眼皮撑大
        pupilScale = 1 + Math.abs(normalizedDy) * 1.8;
        eyelidScale = 1 + Math.abs(normalizedDy) * 0.3; 
      } else {
        // 向下看：瞳孔缩小，眼皮眯起
        pupilScale = 1 - normalizedDy * 1.5;
        eyelidScale = 1 - normalizedDy * 0.3; 
      }
      
      pupilScale = Math.min(1.4, Math.max(0.7, pupilScale));
      eyelidScale = Math.min(1.3, Math.max(0.7, eyelidScale));
      
      const eyeShape = eye.querySelector('.eye-shape');
      const pupil = eye.querySelector('.pupil');
      
      if (pupil) {
        pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${pupilScale})`;
      }
      
      // 如果当前不在眨眼状态，才应用缩放
      if (eyeShape && !eyeShape.classList.contains('blinking')) {
        eyeShape.style.transform = `scaleY(${eyelidScale})`;
      }
    });

    playStickySound();
  }

  // 4. 点击交互：只触发离手指最近的那几只眼睛眨眼
  let lastClickTime = 0;
  function handleClick(e) {
    const now = Date.now();
    if (now - lastClickTime < 200) return; // 防止移动端 touchstart 和 click 双重触发
    lastClickTime = now;

    initAudio();
    
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    
    let blinkedCount = 0;
    const eyes = document.querySelectorAll('.eye');
    
    // 打乱数组顺序，让触发更随机
    const shuffledEyes = Array.from(eyes).sort(() => Math.random() - 0.5);
    
    shuffledEyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      
      const dist = Math.hypot(clientX - eyeX, clientY - eyeY);
      // 只触发距离手指 200px 内的眼睛，且限制每次最多触发 5 只，绝不触发全屏
      if (dist < 200 && blinkedCount < 5) {
        blinkedCount++;
        const eyeShape = eye.querySelector('.eye-shape');
        if (eyeShape && !eyeShape.classList.contains('blinking')) {
          eyeShape.classList.add('blinking');
          setTimeout(() => {
            eyeShape.classList.remove('blinking');
            eyeShape.style.transform = ''; 
          }, 200);
        }
      }
    });

    // 如果有眼睛被触发，就播放眨眼声
    if (blinkedCount > 0) {
      playBlinkSound();
    }
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });
  document.addEventListener('click', handleClick);
  document.addEventListener('touchstart', handleClick, { passive: false });

  // 初始化
  createTexts();
  createEyes();

  // 1.5秒后：屏幕疯狂闪烁，眼睛出现，伴随惊吓音效
  setTimeout(() => {
    initAudio(); 
    document.body.classList.add('flashing');
    document.querySelectorAll('.eye').forEach(eye => {
      eye.classList.add('spawned');
    });
    playJumpscare();
  }, 1500);

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      createTexts();
      createEyes();
    }, 300);
  });
</script>

</body>
