<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>你找到了这里</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#ff0000; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif; }

  #eyes { position:fixed; inset:0; z-index:1; overflow:hidden; }

  /* 惊悚眼眶：不规则多边形裁切，统一内眼角朝左 */
  .eye {
    position:absolute;
    background: #fff;
    clip-path: polygon(
      0% 50%,      /* 内眼角（左侧尖锐） */
      10% 20%,     /* 上边缘内侧 */
      30% 8%,      /* 上边缘中内 */
      55% 5%,      /* 上边缘中外 */
      85% 15%,     /* 上边缘外侧 */
      100% 45%,    /* 外眼角（右侧） */
      90% 75%,     /* 下边缘外侧 */
      65% 95%,     /* 下边缘中外 */
      35% 92%,     /* 下边缘中内 */
      15% 80%      /* 下边缘内侧 */
    );
    box-shadow: inset 0 0 15px rgba(180, 0, 0, 0.9), inset 0 0 5px rgba(255, 0, 0, 0.5);
    opacity: 0;
    transform: scale(0);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.9));
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* 眼珠：纯黑色 */
  .pupil {
    position: absolute;
    width: 35%;
    height: 65%;
    background: #000;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    box-shadow: 0 0 8px #000;
  }

  /* 红血丝细节 */
  .eye::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(150, 0, 0, 0.4) 0%, transparent 20%),
      radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.3) 0%, transparent 25%),
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(100, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  .eye.spawned {
    opacity: 1;
    transform: scale(1);
    animation: shake 0.12s linear infinite;
  }

  @keyframes shake {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    25% { transform: scale(1) translate(1px, -1px) rotate(1deg); }
    50% { transform: scale(1) translate(-1px, 1px) rotate(-1deg); }
    75% { transform: scale(1) translate(1px, 1px) rotate(0.5deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }

  .vignette {
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.6) 100%);
  }

  .text-wrap {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw;
    pointer-events:none;
  }

  .text {
    max-width:1000px;
    color:#000;
    font-weight:900;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Heiti SC", sans-serif;
    font-size:clamp(26px, 6vw, 64px);
    line-height:1.55;
    text-align:center;
    letter-spacing:.06em;
    text-shadow: none;
  }

  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flashing #flash-overlay {
    animation: flashInfinite 0.12s infinite;
  }

  @keyframes flashInfinite {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
  }

  .flashing .text {
    animation: textFlash 0.12s infinite;
  }
  @keyframes textFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="eyes"></div>
<div class="vignette"></div>

<div class="text-wrap">
  <div class="text">
    我很痛苦<br>
    我感觉到我的灵魂似乎割裂了<br>
    所有人都这么做吗<br>
    我不理解<br>
    究竟是我脑子出问题了<br>
    还是他们都不正常呢？
  </div>
</div>

<script>
  // ================= 音频系统 =================
  let audioCtx = null;
  let isAudioInitialized = false;
  let flickerSoundInterval = null;

  function initAudio() {
    if (isAudioInitialized) return;
    isAudioInitialized = true;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // 1. 启动低频环境轰鸣（带有微弱心跳脉动）
    const lowOsc = audioCtx.createOscillator();
    const lowGain = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();

    lowOsc.type = 'sawtooth';
    lowOsc.frequency.value = 45; // 低沉频率
    
    lfo.frequency.value = 0.5; // 脉动速度（0.5Hz，每秒半次，类似缓慢心跳）
    lfoGain.gain.value = 0.5; // 脉动深度
    
    lfo.connect(lfoGain);
    lfoGain.connect(lowGain.gain); // 用LFO调制音量
    
    lowGain.gain.value = 0.1; // 基础音量
    
    lowOsc.connect(lowGain);
    lowGain.connect(audioCtx.destination);
    
    lowOsc.start();
    lfo.start();

    // 2. 启动无限闪烁的电流声
    flickerSoundInterval = setInterval(playFlickerSound, 130);
  }

  // 短促、随机、尖锐的电流声
  function playFlickerSound() {
    if (!audioCtx || !document.body.classList.contains('flashing')) return;
    if (Math.random() < 0.3) return; // 随机跳过一些声音，使其不规则
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 800, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  // 3. 1.5秒时的惊吓爆发声
  function playJumpscare() {
    if (!audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // 4. 眼球转动的摩擦声（带节流防卡顿）
  let lastEyeSoundTime = 0;
  function playEyeMoveSound() {
    if (!audioCtx) return;
    const now = Date.now();
    if (now - lastEyeSoundTime < 60) return; // 60ms 节流，防止声音过于密集
    lastEyeSoundTime = now;

    const bufferSize = audioCtx.sampleRate * 0.02; // 20ms 极短噪音
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 300 + Math.random() * 200;
    filter.Q.value = 5;
    
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    
    noise.start();
  }


  // ================= 视觉与交互系统 =================
  const eyesLayer = document.getElementById('eyes');

  function createEyes() {
    eyesLayer.innerHTML = '';

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    
    const regions = [
      { xMin: 5, xMax: 95, yMin: 5, yMax: 20 },   // 顶部
      { xMin: 5, xMax: 95, yMin: 80, yMax: 95 },  // 底部
      { xMin: 5, xMax: 15, yMin: 20, yMax: 80 },  // 左侧
      { xMin: 85, xMax: 95, yMin: 20, yMax: 80 }  // 右侧
    ];

    const placedEyes = []; 
    const eyeCount = Math.min(30, Math.max(12, Math.floor(screenW / 50))); 

    for (let i = 0; i < eyeCount; i++) {
      const region = regions[i % regions.length];
      
      let x, y, w, h, cx, cy;
      let validPlacement = false;
      let attempts = 0;

      while (!validPlacement && attempts < 50) {
        x = region.xMin + Math.random() * (region.xMax - region.xMin); 
        y = region.yMin + Math.random() * (region.yMax - region.yMin); 
        
        w = Math.random() * 90 + 50; 
        h = w * 0.45; 

        cx = (x / 100) * screenW;
        cy = (y / 100) * screenH;

        let tooClose = false;
        for (let eye of placedEyes) {
          const dist = Math.hypot(cx - eye.cx, cy - eye.cy);
          if (dist < (w + eye.w) * 0.9) { 
            tooClose = true;
            break;
          }
        }

        if (!tooClose) validPlacement = true;
        attempts++;
      }

      if (!validPlacement) continue;

      placedEyes.push({ cx, cy, w });

      const el = document.createElement('div');
      el.className = 'eye';
      
      const pupil = document.createElement('div');
      pupil.className = 'pupil';
      el.appendChild(pupil);

      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      
      el.dataset.cx = cx;
      el.dataset.cy = cy;

      eyesLayer.appendChild(el);
    }
  }

  function handleMove(e) {
    // 首次触碰或移动时初始化音频
    initAudio();

    let clientX, clientY;
    
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      
      const angle = Math.atan2(clientY - eyeY, clientX - eyeX);
      
      const eyeWidth = parseFloat(eye.style.width);
      
      // 扩大移动范围 (22%)
      const maxShift = eyeWidth * 0.22; 
      
      const dx = Math.cos(angle) * maxShift;
      const dy = Math.sin(angle) * maxShift;
      
      // 生理性缩放
      let scaleFactor = 1;
      const normalizedDy = dy / eyeWidth; 
      
      if (normalizedDy < 0) {
        scaleFactor = 1 + Math.abs(normalizedDy) * 2.0; // 向上看放大
      } else {
        scaleFactor = 1 - normalizedDy * 1.6; // 向下看缩小
      }
      
      scaleFactor = Math.min(1.45, Math.max(0.65, scaleFactor));
      
      const pupil = eye.querySelector('.pupil');
      if (pupil) {
        pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scaleFactor})`;
      }
    });

    // 播放眼珠移动的声音
    playEyeMoveSound();
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('touchstart', handleMove, { passive: false });

  createEyes();

  // 1.5秒后：屏幕疯狂闪烁，眼睛出现，伴随惊吓音效
  setTimeout(() => {
    // 尝试初始化音频（如果用户还没碰过屏幕，可能被浏览器拦截，但碰过就会播放）
    initAudio(); 
    
    document.body.classList.add('flashing');

    document.querySelectorAll('.eye').forEach(eye => {
      eye.classList.add('spawned');
    });

    // 播放惊吓爆发声
    playJumpscare();
  }, 1500);

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(createEyes, 300);
  });
</script>

</body>
</html>
